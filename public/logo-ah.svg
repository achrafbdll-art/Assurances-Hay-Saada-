<svg width="195" height="105" viewBox="0 0 195 105" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle avec la lettre A blanche à l'intérieur -->
  <circle cx="42" cy="42" r="38" fill="#2d2d2d" />
  <text
    x="42"
    y="58"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="50"
    fill="#ffffff"
  >
    A
  </text>

  <!-- Lettre H majuscule bold -->
  <text
    x="90"
    y="65"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="68"
    fill="#2d2d2d"
  >
    H
  </text>

  <!-- Point circulaire '.' après le H -->
  <circle cx="152" cy="61" r="7" fill="#2d2d2d" />

  <!-- Texte HAY SAADA et ASSURANCES sous le H. -->
  <g fill="#2d2d2d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" letter-spacing="0.4">
    <text x="91" y="82">HAY SAADA</text>
    <text x="91" y="98">ASSURANCES</text>
  </g>
</svg>
