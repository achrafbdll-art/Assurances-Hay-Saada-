<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none">
  <!-- Monogramme AH Didone Stylisé -->
  <g fill="#002868" transform="translate(10, 2)">
    <!-- Lettre A : Jambe gauche galbée avec goutte Didone -->
    <circle cx="21" cy="72" r="3.8" />
    <path d="M 21.2 68.2 C 22.8 61.5 29.5 40 42.5 16 L 46 16 C 32.5 40 25.2 61.5 24.2 68.5 Z" />
    
    <!-- Empattement sommital plat du A -->
    <rect x="36" y="14" width="16" height="2.2" rx="0.3" />
    
    <!-- Fût diagonal épais Didone du A -->
    <polygon points="43.5,16 52,16 73.5,73 64.5,73" />
    
    <!-- Empattement bilatéral à la base du A -->
    <rect x="57" y="73" width="22" height="2.5" rx="0.3" />

    <!-- Lettre H : Fût gauche et empattements -->
    <rect x="79" y="14" width="20" height="2.2" rx="0.3" />
    <rect x="86" y="16" width="6" height="57" />
    <rect x="79" y="73" width="20" height="2.5" rx="0.3" />

    <!-- Lettre H : Fût droit Didone et empattements -->
    <rect x="115" y="14" width="24" height="2.2" rx="0.3" />
    <rect x="122" y="16" width="10" height="57" />
    <rect x="115" y="73" width="24" height="2.5" rx="0.3" />

    <!-- Trait de ligature fluide en S joignant le A et le H -->
    <path d="
      M 24 51
      C 30 47, 38 39, 51 39
      C 63 39, 72 45, 86 44
      C 97 43.2, 112 39, 126 39.5
      C 134 39.8, 142 41.5, 146 39
      C 147.5 38, 147.2 36.2, 145.5 36.5
      C 142 37.8, 134 36.8, 126 36.5
      C 112 36, 97 40.5, 86 41
      C 72 41.8, 63 36, 51 36
      C 38 36, 30 44, 24 48
      Z
    " />
    <circle cx="146.5" cy="38.5" r="1.6" />
  </g>

  <!-- Séparateur vertical fin -->
  <line x1="172" y1="20" x2="172" y2="76" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Typographie : ASSURANCES HAY SAADA en une seule ligne -->
  <g transform="translate(190, 42)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="0.5">
      <tspan fill="#001f5c">ASSURANCES </tspan>
      <tspan fill="#ff0000">HAY SAADA</tspan>
    </text>
  </g>

  <!-- Sous-titre : AGENT GÉNÉRAL AXA ASSURANCE MAROC -->
  <text x="190" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#64748b" letter-spacing="1.5">
    AGENT GÉNÉRAL AXA ASSURANCE MAROC
  </text>
</svg>
