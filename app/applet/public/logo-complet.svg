<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" fill="none">
  <!-- Monogramme Logo officiel Hay Saada Assurances (conforme photo) -->
  <g transform="translate(10, 8) scale(0.28)">
